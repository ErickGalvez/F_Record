<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./js/CSInterface-6.1.0.js"></script>
    <script src="path/to/js"></script>
    <link rel="stylesheet" type="text/css" href="./css/fonts/stylesheet.css">
    <link rel="stylesheet" id="theme-link" href="./css/topcoat/topcoat-desktop-dark.min.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: source-sans-pro, sans-serif;
            position: relative;
            -webkit-font-smoothing: antialiased;
            padding-left: 20px;
            padding-right: 20px;
        }

        .add-folder-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s ease;
        }

            .add-folder-btn:hover {
                background-color: #45a049;
            }
    </style>
</head>

<body id="body">
    <br><br>
    <label for="rootPath">rootPath</label>
    <input type="text" id="rootPath" name="rootPath" oninput="updateRootPath()" style="width: 200px;float: right;">
    <br><br>
    <br>
    <button id="start-btn" onclick="startOrStopRecord()" class="topcoat-button--cta" style="width: 100px;height: 50px;font-size: 20px;">startOrStopRecord</button>
    <button id="clear-btn" onclick="clearProcessImages()" class="topcoat-button--cta" style="width: 100px;height: 50px;font-size: 20px;">clearProcessImages</button>
    <button id="output-btn" onclick="outputVideo()" class="topcoat-button--cta" style="width: 100px;height: 50px;font-size: 20px;float: right;">outputVideo</button>
    <br><br>
    <button id="add-folder-btn" onclick="addFolder()" class="topcoat-button--cta" style="width: 150px;height: 50px;font-size: 20px;">Add Folder</button>
    <br><br>
    <label for="savePath">savePath</label>
    <input type="text" id="savePath" name="savePath" oninput="updateSavePath()" style="width: 400px;float: left;" disabled>
    <br><br>
    <label for="imageCount">imageCount</label>
    <span class="number" id="imageCount" name="imageCount" style="float: right;">0</span>
    <br><br>
    <label for="minRecordInterval">MinRecordInterval</label>
    <input type="number" id="minRecordInterval" name="minRecordInterval" style="width: 60px;float: right;" oninput="updateMinRecordInterval()">
    <br><br>
    <label for="videoDuration">videoDuration</label>
    <input type="number" id="videoDuration" name="videoDuration" style="width: 60px;float: right;" oninput="updateVideoDuration()">
    <br><br>
    <span id="author" name="author" style="float: right;vertical-align: bottom;font-size: 10;">作者 F_know</span>

    <!-- Ensure the scripts are loaded after the DOM is ready -->
    <script src="js/main.js"></script>
    <script src="js/CSInterface-6.1.0.js"></script>
</body>

</html>
